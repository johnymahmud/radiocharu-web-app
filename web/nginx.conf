server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Disable aggressive caching for HTML, CSS, JS, JSON
    location ~* \.(css|js|html|json)$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        expires off;
        try_files $uri =404;
    }

    # Listener Web App (Root)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # RJ / Broadcaster Admin Panel
    location /admin/ {
        alias /usr/share/nginx/html/admin/;
        index index.html;
        try_files $uri $uri/ /admin/index.html;
    }

    # Reverse Proxy for Icecast Live Telemetry JSON
    location /status-json.xsl {
        proxy_pass http://icecast:8000/status-json.xsl;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Ensure CORS headers for cross-origin / browser access
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type" always;
    }

    # Reverse Proxy for Live Audio Stream
    location /live {
        proxy_pass http://icecast:8000/live;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Disable proxy buffering for continuous live audio streaming
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        tcp_nodelay on;

        add_header Access-Control-Allow-Origin "*" always;
    }

    # Optional Reverse Proxy for Icecast Admin Web Interface
    location /icecast-admin/ {
        proxy_pass http://icecast:8000/admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
