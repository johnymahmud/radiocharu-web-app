<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="charuGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a472a"/>
      <stop offset="60%" stop-color="#0e2817"/>
      <stop offset="100%" stop-color="#07150c"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f39c12"/>
      <stop offset="50%" stop-color="#e8871e"/>
      <stop offset="100%" stop-color="#dcae1d"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Background Circle -->
  <rect width="512" height="512" rx="128" fill="url(#charuGrad)"/>
  <rect width="496" height="496" x="8" y="8" rx="120" fill="none" stroke="#2d5e3f" stroke-width="4"/>

  <!-- Radio Waves -->
  <circle cx="256" cy="270" r="160" fill="none" stroke="url(#goldGrad)" stroke-width="12" stroke-linecap="round" stroke-dasharray="140 300" opacity="0.35"/>
  <circle cx="256" cy="270" r="120" fill="none" stroke="url(#goldGrad)" stroke-width="14" stroke-linecap="round" stroke-dasharray="110 240" opacity="0.6"/>
  <circle cx="256" cy="270" r="80" fill="none" stroke="url(#goldGrad)" stroke-width="16" stroke-linecap="round" stroke-dasharray="80 180" opacity="0.85"/>

  <!-- Microphone / Tower Center -->
  <circle cx="256" cy="270" r="34" fill="url(#goldGrad)" filter="url(#glow)"/>
  
  <!-- Bengali "চারু" / Wave Icon Stylization -->
  <path d="M190 390 L256 320 L322 390" fill="none" stroke="#ffffff" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
  <line x1="256" y1="320" x2="256" y2="430" stroke="#ffffff" stroke-width="16" stroke-linecap="round"/>
  <line x1="200" y1="430" x2="312" y2="430" stroke="#ffffff" stroke-width="16" stroke-linecap="round"/>

  <!-- Top Accent Dot -->
  <circle cx="256" cy="110" r="14" fill="#e8871e" filter="url(#glow)"/>
</svg>
